<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente sutil para el isotipo -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- ISOTIPO (Insignia T1) -->
  <g transform="translate(6, 6)">
    <!-- Contenedor cuadrado con borde fino -->
    <rect width="52" height="52" rx="14" fill="url(#badgeGrad)" stroke="#27272a" stroke-width="1.5" />
    
    <!-- T central geométrica -->
    <path d="M15 17 H33 V22 H26.5 V37 H21.5 V22 H15 V17 Z" fill="#f4f4f5" />
    
    <!-- 1 dinámico en acento blanco -->
    <path d="M32 23.5 L36.5 20.5 V37 H32.5 V25.5 Z" fill="#e4e4e7" />
    
    <!-- Punto rojo acento Perú -->
    <circle cx="40" cy="14" r="3.5" fill="url(#redAccent)" />
  </g>

  <!-- LOGOTIPO / TEXTO -->
  <!-- "TODO EN UNO" -->
  <text x="74" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5" fill="currentColor">
    Todo en Uno
  </text>

  <!-- Subtítulo técnico -->
  <text x="75" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.2" fill="#71717a">
    HERRAMIENTAS & FINANZAS
  </text>

  <!-- Insignia PE (Banderita / Código país) -->
  <g transform="translate(208, 17)">
    <rect width="32" height="18" rx="5" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="16" y="12.5" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#f4f4f5" text-anchor="middle">PE</text>
    <!-- Micro barra de la bandera peruana -->
    <rect x="25" y="5" width="2" height="8" rx="1" fill="#ef4444" />
  </g>
</svg>